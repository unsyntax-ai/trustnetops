<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trustnet Ops</title>
<meta name="description" content="Your work, our word. Coming soon.">
<style>
  :root { --primary: #ffffff; --secondary: #008430; --accent: #d62828; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 16px; text-align: center;
    background: var(--primary); color: var(--secondary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    border-top: 8px solid var(--secondary);
  }
  h1 { margin: 0; font-size: clamp(2.5rem, 9vw, 5rem); letter-spacing: -.02em; }
  .tag { margin: .5rem 0 2rem; font-size: clamp(1.1rem, 3vw, 1.5rem); font-style: italic; }
  .soon {
    display: inline-block; padding: .6rem 1.6rem; border-radius: 999px;
    background: var(--accent); color: var(--primary);
    font-weight: 700; letter-spacing: .15em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <main>
    <h1>Trustnet Ops</h1>
    <p class="tag">Your work, our word</p>
    <span class="soon">Coming soon</span>
  </main>
</body>
</html>
