<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trustnet Ops</title>
<meta name="description" content="Your work, our word. Coming soon.">
<meta name="theme-color" content="#003087">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
  /* ratio: navy 60 / white 27 / green 10 / red 3 */
  :root {
    --navy: #003087; --navy-deep: #00164a; --white: #ffffff; --green: #008430; --red: #ff0000;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; overflow: hidden; position: relative;
    display: grid; place-items: center; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 90% at 50% 0%, #0a3fa5 0%, var(--navy) 45%, var(--navy-deep) 100%);
    color: var(--white); -webkit-font-smoothing: antialiased;
  }

  /* aurora: slow, soft light that never repeats the same way twice */
  .aurora { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .aurora i {
    position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; will-change: transform;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .aurora i:nth-child(1) { width: 60vmax; height: 60vmax; left: -15vmax; top: -20vmax; background: #2f6fe0; }
  .aurora i:nth-child(2) { width: 46vmax; height: 46vmax; right: -12vmax; bottom: -18vmax; background: var(--green); opacity: .5; animation-duration: 28s; animation-delay: -8s; }
  .aurora i:nth-child(3) { width: 38vmax; height: 38vmax; left: 30%; bottom: -26vmax; background: #1a4fc0; animation-duration: 34s; animation-delay: -15s; }
  .aurora i:nth-child(4) { width: 14vmax; height: 14vmax; right: 18%; top: 8%; background: var(--red); opacity: .16; animation-duration: 26s; animation-delay: -4s; }
  @keyframes drift {
    from { transform: translate3d(0, 0, 0) scale(1); }
    to   { transform: translate3d(8vmax, 6vmax, 0) scale(1.18); }
  }

  /* fine film grain keeps the gradients from banding */
  .grain {
    position: fixed; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  main { position: relative; display: flex; flex-direction: column; align-items: center; max-width: 960px; }

  /* staggered entrance */
  .in { opacity: 0; transform: translateY(18px); filter: blur(10px); animation: rise 1.4s var(--ease) forwards; animation-delay: calc(var(--d) * 1ms); }
  @keyframes rise { to { opacity: 1; transform: none; filter: none; } }

  .status {
    display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px 9px 14px; border-radius: 999px;
    font: 600 .8rem "Times New Roman", Times, serif; letter-spacing: .18em; text-transform: uppercase;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18);
    -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2);
  }
  .status b { width: 7px; height: 7px; border-radius: 50%; background: var(--red); animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255,0,0,.65); } 70%, 100% { box-shadow: 0 0 0 10px rgba(255,0,0,0); } }

  h1 {
    margin: clamp(28px, 6vh, 56px) 0 0;
    font: 700 clamp(3rem, 13vw, 8.5rem)/1 Poppins, system-ui, sans-serif; letter-spacing: -.045em;
    color: var(--white);
    background: linear-gradient(110deg, #fff 0%, #fff 40%, #a9c4ff 50%, #fff 60%, #fff 100%) 100% 0 / 300% 100%;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  h1.in { animation: rise 1.4s var(--ease) calc(var(--d) * 1ms) forwards, sheen 7s ease-in-out 2.2s infinite; }
  @keyframes sheen { 0% { background-position: 100% 0; } 45%, 100% { background-position: 0 0; } }

  .tag {
    margin: clamp(14px, 2.5vh, 24px) 0 0;
    font: 600 clamp(1.25rem, 3.6vw, 2rem)/1.3 "Times New Roman", Times, serif; letter-spacing: .01em;
    color: rgba(255,255,255,.78);
  }

  .pill {
    position: relative; margin-top: clamp(36px, 8vh, 72px); display: inline-flex; align-items: center; justify-content: center;
    padding: 18px 44px; border-radius: 999px; overflow: hidden; isolation: isolate;
    font: 700 .95rem Poppins, system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase;
    color: var(--navy); background: var(--white);
    box-shadow: 0 0 0 1px rgba(255,255,255,.4), 0 18px 50px -12px rgba(255,255,255,.35), 0 0 80px -10px rgba(0,132,48,.55);
  }
  .pill.in { animation: rise 1.4s var(--ease) calc(var(--d) * 1ms) forwards, breathe 4.5s ease-in-out 2.4s infinite; }
  .pill::before { /* light passing across the surface */
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(100deg, transparent 30%, rgba(0,132,48,.22) 50%, transparent 70%) -150% 0 / 60% 100% no-repeat;
    animation: glide 4.5s ease-in-out 2s infinite;
  }
  .pill::after { /* hairline progress at the base */
    content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--green);
    transform-origin: left; animation: fill 4.5s var(--ease) 2s infinite;
  }
  @keyframes glide { 0% { background-position: -150% 0; } 60%, 100% { background-position: 250% 0; } }
  @keyframes fill { 0% { transform: scaleX(0); opacity: 1; } 70% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
  @keyframes breathe { 50% { transform: scale(1.035); } }

  footer {
    position: fixed; left: 0; right: 0; bottom: max(20px, env(safe-area-inset-bottom));
    font: 600 .85rem "Times New Roman", Times, serif; letter-spacing: .08em; color: rgba(255,255,255,.45);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    .in, h1, .pill { opacity: 1; transform: none; filter: none; }
  }
</style>
</head>
<body>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="grain" aria-hidden="true"></div>

  <main>
    <div class="status in" style="--d:100"><b></b>Launching soon</div>
    <h1 class="in" style="--d:300">Trustnet Ops</h1>
    <p class="tag in" style="--d:550">Your work, our word</p>
    <div class="pill in" style="--d:800">Coming soon</div>
  </main>

  <footer class="in" style="--d:1100">&copy; 2026 Trustnet Ops</footer>
</body>
</html>
