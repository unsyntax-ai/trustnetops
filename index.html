<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trustnet Ops</title>
<meta name="description" content="Your work, our word. Coming soon.">
<meta name="theme-color" content="#003087">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap" rel="stylesheet">
<style>
  /* flat colour only: navy 60 / white 27 / green 10 / red 3 */
  :root {
    --navy: #003087; --navy-deep: #00225f; --white: #ffffff; --green: #008430; --red: #ff0000;
    --settle: cubic-bezier(.16, 1, .3, 1);
    --cycle: 10s; /* one reveal, hold and exit, then it starts again */
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; overflow: hidden;
    display: grid; place-items: center; text-align: center;
    padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
    background: var(--navy); color: var(--white); -webkit-font-smoothing: antialiased;
  }
  main { display: flex; flex-direction: column; align-items: center; max-width: 60rem; }

  /* title: each letter rises out of a mask, holds, then leaves upward */
  h1 {
    margin: 0; padding-bottom: .14em; margin-bottom: -.14em; overflow: hidden;
    font: 700 clamp(3rem, 13vw, 8.5rem)/1.02 Poppins, system-ui, sans-serif; letter-spacing: -.035em;
  }
  h1 span { display: inline-block; animation: letter var(--cycle) infinite backwards; animation-delay: calc(var(--i) * 50ms); }
  h1 .sp { width: .28em; }
  .ops { color: var(--red); }
  @keyframes letter {
    0%   { transform: translateY(115%); animation-timing-function: var(--settle); }
    14%  { transform: none; animation-timing-function: step-end; }
    76%  { transform: none; animation-timing-function: cubic-bezier(.7, 0, .84, 0); }
    90%, 100% { transform: translateY(-115%); }
  }

  /* tagline and glass follow the title on the same cycle */
  .tag, .stage { animation: follow var(--cycle) infinite backwards; animation-delay: calc(var(--d) * 1ms); }
  .tag {
    margin: clamp(.9rem, 2.5vh, 1.5rem) 0 0;
    font: 600 clamp(1.25rem, 3.6vw, 2rem)/1.3 "Times New Roman", Times, serif; color: rgba(255,255,255,.85);
  }
  @keyframes follow {
    0%   { opacity: 0; transform: translateY(.9rem); filter: blur(8px); animation-timing-function: var(--settle); }
    14%  { opacity: 1; transform: none; filter: none; animation-timing-function: step-end; }
    76%  { opacity: 1; transform: none; filter: none; animation-timing-function: ease-in; }
    90%, 100% { opacity: 0; transform: translateY(-.9rem); filter: blur(8px); }
  }

  /* liquid glass: a flat red lens drifts underneath; the pane frosts and bends it */
  .stage { position: relative; margin-top: clamp(2.5rem, 9vh, 5rem); }
  .lens { position: absolute; left: 50%; top: 50%; width: 2.2rem; height: 2.2rem; margin: -1.1rem 0 0 -1.1rem; border-radius: 50%; background: var(--red); animation: lx 7s ease-in-out infinite alternate, ly 5s ease-in-out infinite alternate; }
  @keyframes lx { from { translate: -8.5rem 0; } to { translate: 8.5rem 0; } }
  @keyframes ly { from { transform: translateY(-1.4rem); } to { transform: translateY(1.4rem); } }

  .glass {
    position: relative; display: inline-flex; align-items: center; justify-content: center;
    padding: 1.15rem 3rem; border-radius: 999px;
    font: 700 .95rem Poppins, system-ui, sans-serif; letter-spacing: .22em; text-transform: uppercase;
    color: var(--white); text-shadow: 0 1px 8px rgba(0,20,70,.45);
    background: rgba(255,255,255,.14);
    -webkit-backdrop-filter: blur(14px) saturate(180%); backdrop-filter: blur(14px) saturate(180%);
    border: 1px solid rgba(255,255,255,.28);
    box-shadow:
      inset 1.5px 1.5px 0 rgba(255,255,255,.6),
      inset -1.5px -1.5px 0 rgba(255,255,255,.18),
      inset 0 0 22px rgba(255,255,255,.14),
      0 14px 34px -8px rgba(0,10,40,.45);
  }
  .refract .glass { -webkit-backdrop-filter: url(#liquid) blur(3px) saturate(180%); backdrop-filter: url(#liquid) blur(3px) saturate(180%); }

  footer {
    position: fixed; left: 0; right: 0; bottom: max(1.25rem, env(safe-area-inset-bottom));
    font: 600 .85rem "Times New Roman", Times, serif; letter-spacing: .08em; color: rgba(255,255,255,.65);
  }

  @media (prefers-reduced-motion: reduce) {
    h1 span, .tag, .stage, .lens { animation: none; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass { background: var(--navy-deep); -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  }
  @media (prefers-contrast: more) {
    .glass { background: var(--navy-deep); border-color: var(--white); }
    .tag, footer { color: var(--white); }
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .02" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="40" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main>
    <h1 aria-label="Trustnet Ops"></h1>
    <p class="tag" style="--d:500">Your work, our word</p>
    <div class="stage" style="--d:800">
      <i class="lens"></i>
      <div class="glass">Coming soon</div>
    </div>
  </main>

  <footer>&copy; 2026 Trustnet Ops</footer>

<script>
  // Chromium can run an SVG filter inside backdrop-filter; others keep the frosted blur
  if (navigator.userAgentData) document.documentElement.classList.add("refract");
  // split the title into letters for the staggered mask reveal; "Ops" is the red word
  document.querySelector("h1").innerHTML = [..."Trustnet Ops"].map((c, i) =>
    c === " " ? '<span class="sp" aria-hidden="true"></span>'
              : `<span aria-hidden="true" class="${i > 8 ? "ops" : ""}" style="--i:${i}">${c}</span>`).join("");
</script>
</body>
</html>
